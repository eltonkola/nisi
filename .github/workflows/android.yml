name: Build and Release Launcher

on:
  workflow_dispatch: # Allows manual triggering
    inputs:
      version:
        description: 'Release version (e.g., 1.0.1). Do not include "v" prefix.'
        required: true
        default: '1.0.0'
      release_notes:
        description: 'Specific notes for this release (optional). Will be added to a default message.'
        required: false
        default: 'General improvements and bug fixes.'

jobs:
  lint-android:
    name: Lint Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties with API Keys
        run: |
          echo "Creating local.properties file..."
          {
            printf "PEXELS_API_KEY=%s\n" "${{ secrets.PEXELS_API_KEY }}"
            printf "OPENWEATHERMAP_API_KEY=%s\n" "${{ secrets.OPENWEATHERMAP_API_KEY }}"
          } > local.properties
          echo "local.properties created."

      - name: Run Android Lints
        run: ./gradlew :app:lint

  build-android:
    name: Build and Sign Android APK
    runs-on: ubuntu-latest
    needs: [lint-android] # Depends on successful linting
    outputs: # Define output for the APK path
      apk_name: ${{ steps.rename_apk.outputs.apk_name }}
      apk_path: ${{ steps.rename_apk.outputs.apk_path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties with API Keys
        run: |
          echo "Creating local.properties file..."
          {
            printf "PEXELS_API_KEY=%s\n" "${{ secrets.PEXELS_API_KEY }}"
            printf "OPENWEATHERMAP_API_KEY=%s\n" "${{ secrets.OPENWEATHERMAP_API_KEY }}"
          } > local.properties
          echo "local.properties created."

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease

      - name: Setup build tool version variable
        shell: bash
        run: |
          # Attempt to find build tools, sort version-sensitively if possible
          if command -v sort &> /dev/null && sort --version-sort --help &> /dev/null; then
            LATEST_BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | sort -V | tail -n 1)
          else # Fallback to simple lexical sort if sort -V is not available
            LATEST_BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          fi
          echo "Determined latest build tool version: $LATEST_BUILD_TOOL_VERSION"
          echo "BUILD_TOOL_VERSION_DYNAMIC=$LATEST_BUILD_TOOL_VERSION" >> $GITHUB_ENV

      - name: Sign APK
        id: sign_apk
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION_DYNAMIC }}

      - name: Rename Signed APK and Set Output
        id: rename_apk
        run: |
          original_apk_path="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          apk_version="${{ github.event.inputs.version }}"
          new_apk_name="Stox-${apk_version}.apk"
          new_apk_path="app/build/outputs/apk/release/${new_apk_name}" # Define full path

          if [ ! -f "$original_apk_path" ]; then
            echo "::error::Original signed APK not found at '$original_apk_path'."
            exit 1
          fi
          
          mv "$original_apk_path" "$new_apk_path"
          echo "Renamed APK to $new_apk_name at $new_apk_path"
          
          echo "apk_name=$new_apk_name" >> $GITHUB_OUTPUT
          echo "apk_path=$new_apk_path" >> $GITHUB_OUTPUT


      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-${{ github.event.inputs.version }} # Unique artifact name
          path: ${{ steps.rename_apk.outputs.apk_path }}
          if-no-files-found: error # Fail if APK not found

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android] # Depends on successful build and sign
    permissions:
      contents: write # To create releases and upload assets
    steps:
      - name: Download Signed APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-apk-${{ github.event.inputs.version }} # Matches unique upload name
          path: release-assets/ # APK will be downloaded into this directory

      - name: List Downloaded Files (for debugging)
        run: |
          echo "Listing contents of release-assets/ after download:"
          ls -R release-assets/

      - name: Set up GitHub CLI
        run: |
          type gh > /dev/null 2>&1 || {
            echo "gh CLI not found, attempting to install..."
            sudo apt-get update && sudo apt-get install -y gh
          }
          gh --version

      - name: Create GitHub Release and Upload APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_FROM_INPUT: ${{ github.event.inputs.version }}
          NOTES_FROM_INPUT: ${{ github.event.inputs.release_notes }}
          # Get APK name from the build job's output
          DOWNLOADED_APK_NAME: ${{ needs.build-android.outputs.apk_name }}
        run: |
          RELEASE_TAG="v${VERSION_FROM_INPUT}"
          RELEASE_NAME="Stox ${RELEASE_TAG}"
          
          RELEASE_BODY=$(cat <<EOF
          Release of Stox Android App version ${VERSION_FROM_INPUT}.

          ${NOTES_FROM_INPUT}
          EOF
          )

          echo "Creating release for tag: $RELEASE_TAG"
          echo "Release Name: $RELEASE_NAME"
          echo "Expected APK Name (from build job output): $DOWNLOADED_APK_NAME"
          echo "--- Release Body ---"
          echo "$RELEASE_BODY"
          echo "--------------------"
          
          LOCAL_APK_FILE_PATH="release-assets/${DOWNLOADED_APK_NAME}"

          if [ ! -f "$LOCAL_APK_FILE_PATH" ]; then
            echo "::error::APK file not found at '$LOCAL_APK_FILE_PATH' after download."
            echo "Ensure the artifact download path and the APK name from build job output are correct."
            echo "Current files in release-assets/:"
            ls -R release-assets/
            exit 1
          fi

          # The asset path for gh release create should be "localFilePath#desiredAssetNameOnRelease"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_BODY" \
            --draft=false \
            --prerelease=false \
            "${LOCAL_APK_FILE_PATH}#${DOWNLOADED_APK_NAME}" # Uploads file with its existing name as the asset name
          echo "Release created and APK uploaded as ${DOWNLOADED_APK_NAME}."